name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin contract
        run: python3 scripts/validate_plugin.py
      - name: Tests
        run: python3 -m unittest discover -s tests -q
